name: CI and security
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build --tag commission-calculator:${{ github.sha }} .
      - name: Check nginx and HTTP health
        run: |
          docker run --rm --entrypoint nginx commission-calculator:${{ github.sha }} -t
          docker run --detach --name calculator -p 127.0.0.1:8080:8080 commission-calculator:${{ github.sha }}
          trap 'docker rm --force calculator' EXIT
          for i in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/ > /tmp/index.html
          test -s /tmp/index.html
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: commission-calculator:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: commission-calculator:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
